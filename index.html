    <script>
      // Fix for browser extensions attempting to assign window.fetch when it only has a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHandler = originalFetch ? originalFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHandler;
            },
            set: function(fn) {
              fetchHandler = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already non-configurable
        }

        // Suppress unhandled errors from browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('chrome-extension') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason) {
            var reasonStr = String(event.reason && (event.reason.stack || event.reason.message || event.reason));
            if (reasonStr.indexOf('chrome-extension://') !== -1 || reasonStr.indexOf('Cannot set property fetch') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
